[project]
name = "lead-capture"
version = "0.1.0"
description = "WhatsApp tutor-lead capture: human-like conversation, validated leads to the operations sheet"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "anthropic>=0.40",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
    "email-validator>=2.1",
]

[project.scripts]
lead-capture = "lead_capture.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.5",
    "locust>=2.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_capture"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals", "load"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "eval: calls the real language model (run via lead-capture eval)",
    "load: load tests (run via lead-capture load)",
]
addopts = "-m 'not eval and not load'"
